name: Privacy and identity check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject personal identifiers and invalid commit identities
        run: |
          set -eu
          before="${{ github.event.before || '' }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            commit_range="$before..HEAD"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            if git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
              commit_range="$base_sha..HEAD"
            else
              commit_range="HEAD"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            commit_range="HEAD^..HEAD"
          else
            commit_range="HEAD"
          fi
          test -z "$(git log --no-merges --format='%an <%ae>%n%cn <%ce>' "$commit_range" | grep -Ev '^AcademicContributor <academic-contributor@users\.noreply\.github\.com>$' || true)"
          files=$(git ls-files | grep -Ev '(^|/)(AGENTS|GEMINI)\.md$|^\.githooks/|^\.github/workflows/(privacy-check|auto-merge-contributions)\.yml$' || true)
          if [ -n "$files" ] && printf '%s\n' "$files" | xargs grep -n -I -E '(^|/)(home|Users)/[^/ ]+|ractopen|ryme|197402134|slmails\.com|file:///|BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY'; then
            exit 1
          fi
