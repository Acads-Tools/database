name: Privacy and identity check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject personal identifiers and invalid commit identities
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            commit_range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            commit_range="HEAD^..HEAD"
          fi
          test -z "$(git log --no-merges --format='%an <%ae>%n%cn <%ce>' "$commit_range" | grep -Ev '^AcademicContributor <academic-contributor@users\.noreply\.github\.com>$' || true)"
          files=$(git ls-files | grep -Ev '(^|/)(AGENTS|GEMINI)\.md$|^\.githooks/|^\.github/workflows/(privacy-check|auto-merge-contributions)\.yml$' || true)
          if [ -n "$files" ] && printf '%s\n' "$files" | xargs grep -n -I -E '(^|/)(home|Users)/[^/ ]+|ractopen|ryme|197402134|slmails\.com|file:///|BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY'; then
            exit 1
          fi
