name: Refresh permitted study-guide snapshots

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-study-guide-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out database
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test refresh parsers
        run: |
          python -m unittest discover -s tests -p 'test_refresh_study_guides.py'
          node relay/test_study_guide_refresh.mjs
          node relay/test_contributor_sharing.mjs
          node relay/test_course_reviewability.mjs

      - name: Refresh source snapshots
        run: python scripts/refresh_study_guides.py

      - name: Commit changed source snapshots
        id: commit
        run: |
          set -eu
          git config user.name "AcademicContributor"
          git config user.email "academic-contributor@users.noreply.github.com"
          git add data/am* data/jennysonline
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GIT_AUTHOR_NAME="AcademicContributor" \
          GIT_AUTHOR_EMAIL="academic-contributor@users.noreply.github.com" \
          GIT_COMMITTER_NAME="AcademicContributor" \
          GIT_COMMITTER_EMAIL="academic-contributor@users.noreply.github.com" \
            git commit -m "Refresh study-guide source snapshots" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          test "$(git log -1 --format='%an <%ae>')" = "AcademicContributor <academic-contributor@users.noreply.github.com>"
          test "$(git log -1 --format='%cn <%ce>')" = "AcademicContributor <academic-contributor@users.noreply.github.com>"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
