name: Refresh requested study-guide course

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: study-guide-refresh-${{ github.event.issue.title }}
  cancel-in-progress: false

jobs:
  refresh:
    if: contains(github.event.issue.labels.*.name, 'study-guide-refresh-request')
    runs-on: ubuntu-latest
    steps:
      - name: Check out database
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate refresh request
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const marker = '<!-- automated-study-guide-refresh -->';
            const line = body.split(/\r?\n/).find(value => value.trim().startsWith('{'));
            if (!body.includes(marker) || !line) throw new Error('Invalid refresh request payload');
            const payload = JSON.parse(line);
            if (typeof payload.subjectCode !== 'string' ||
                !/^[A-Z0-9_-]{2,16}$/.test(payload.subjectCode)) {
              throw new Error('Invalid course code');
            }
            core.setOutput('course_code', payload.subjectCode);

      - name: Test source parsers
        run: |
          python -m unittest discover -s tests -p 'test_refresh_study_guides.py'
          node relay/test_study_guide_refresh.mjs
          node relay/test_contributor_sharing.mjs

      - name: Refresh requested course sources
        env:
          COURSE_CODE: ${{ steps.request.outputs.course_code }}
        run: python scripts/refresh_study_guides.py --course-code "$COURSE_CODE"

      - name: Commit updated source snapshots
        run: |
          set -eu
          git config user.name "AcademicContributor"
          git config user.email "academic-contributor@users.noreply.github.com"
          git add data/am* data/jennysonline
          if git diff --cached --quiet; then
            echo "No source snapshot changes for ${{ steps.request.outputs.course_code }}."
            exit 0
          fi
          GIT_AUTHOR_NAME="AcademicContributor" \
          GIT_AUTHOR_EMAIL="academic-contributor@users.noreply.github.com" \
          GIT_COMMITTER_NAME="AcademicContributor" \
          GIT_COMMITTER_EMAIL="academic-contributor@users.noreply.github.com" \
            git commit -m "Refresh study-guide snapshots for ${{ steps.request.outputs.course_code }}" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          test "$(git log -1 --format='%an <%ae>')" = "AcademicContributor <academic-contributor@users.noreply.github.com>"
          test "$(git log -1 --format='%cn <%ce>')" = "AcademicContributor <academic-contributor@users.noreply.github.com>"
          git push

      - name: Close completed request
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
